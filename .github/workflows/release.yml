name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="voban-${GOOS}-${GOARCH}${ext}"
          version="${GITHUB_REF_NAME#v}"
          commit="${GITHUB_SHA::7}"
          go build -trimpath \
            -ldflags "-s -w -X github.com/vobanai/voban-cli/internal/version.Version=${version} -X github.com/vobanai/voban-cli/internal/version.Commit=${commit}" \
            -o "$out" ./cmd/voban

      - uses: actions/upload-artifact@v4
        with:
          name: voban-${{ matrix.goos }}-${{ matrix.goarch }}
          path: voban-${{ matrix.goos }}-${{ matrix.goarch }}*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: checksums
        run: |
          cd artifacts
          sha256sum voban-* > checksums.txt
          cat checksums.txt

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/voban-*
            artifacts/checksums.txt
          generate_release_notes: true
